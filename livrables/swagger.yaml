openapi: 3.0.3
info:
  title: TODO API
  version: 1.0.0
  description: >
    API de gestion d'une TODO List.
servers:
  - url: http://localhost:8080
    description: Serveur local de développement

tags:
  - name: tasks
    description: Opérations sur les tâches

paths:
  /tasks:
    post:
      tags: [ tasks ]
      summary: Créer une tâche
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskDTO'
      responses:
        '201':
          description: Tâche créée avec succès
          headers:
            Location:
              description: URL de la ressource créée
              schema:
                type: string
                example: /tasks/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponseDTO'
        '400':
          description: Paramètre(s) invalide(s)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ErrorDTO'
        '500':
          description: Erreur inattendue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

    get:
      tags: [ tasks ]
      summary: Récupérer toutes les tâches
      operationId: getAllTasks
      responses:
        '200':
          description: Tâches trouvées avec succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskResponseDTO'
        '404':
          description: Aucune tâche trouvée
        '500':
          description: Erreur inattendue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

    delete:
      tags: [ tasks ]
      summary: Supprimer toutes les tâches
      operationId: deleteAllTasks
      responses:
        '204':
          description: Toutes les tâches supprimées avec succès
        '500':
          description: Erreur inattendue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

  /tasks/count:
    get:
      tags: [ tasks ]
      summary: Nombre de tâches
      operationId: countTasks
      description: Retourne le nombre total de tâches
      responses:
        '200':
          description: Nombre de tâches compté avec succès
          content:
            application/json:
              schema:
                type: integer
                example: 3
        '404':
          description: Aucune tâche trouvée
        '500':
          description: Erreur inattendue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

  /tasks/{id}:
    parameters:
      - in: path
        name: id
        required: true
        description: Identifiant numérique de la tâche
        schema:
          type: integer
          minimum: 1

    get:
      tags: [ tasks ]
      summary: Récupérer une tâche par son identifiant
      operationId: getTaskById
      responses:
        '200':
          description: Tâche trouvée avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponseDTO'
        '404':
          description: Tâche non trouvée
        '500':
          description: Erreur inattendue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

    delete:
      tags: [ tasks ]
      summary: Supprimer une tâche par son identifiant
      operationId: deleteTaskById
      responses:
        '204':
          description: Tâche supprimée avec succès
        '404':
          description: Tâche non trouvée
        '500':
          description: Erreur inattendue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

    put:
      tags: [ tasks ]
      summary: Modifier une tâche par son identifiant
      operationId: putTaskById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskDTO'
      responses:
        '204':
          description: Tâche modifiée avec succès
        '400':
          description: Paramètre(s) invalide(s)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ErrorDTO'
        '404':
          description: Tâche non trouvée
        '500':
          description: Erreur inattendue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

components:
  schemas:

    # ── DTO d'entrée : création ───────────────────────────────────────────────
    CreateTaskDTO:
      type: object
      description: Corps de la requête pour créer une tâche. L'id est autogénéré ; done est initialisé à false.
      properties:
        title:
          type: string
          maxLength: 50
          nullable: false
          example: Acheter du lait
        description:
          type: string
          maxLength: 255
          nullable: true
          example: 2L demi-écrémé
      required:
        - title

    # ── DTO d'entrée : modification ───────────────────────────────────────────
    UpdateTaskDTO:
      type: object
      description: Corps de la requête pour modifier une tâche.
      properties:
        title:
          type: string
          maxLength: 50
          nullable: false
          example: Acheter du lait
        description:
          type: string
          maxLength: 255
          nullable: true
          example: 2L demi-écrémé
        done:
          type: boolean
          nullable: false
          example: true
      required:
        - title
        - done

    # ── DTO de sortie ─────────────────────────────────────────────────────────
    TaskResponseDTO:
      type: object
      description: Représentation d'une tâche retournée par l'API.
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Acheter du lait
        description:
          type: string
          nullable: true
          example: 2L demi-écrémé
        done:
          type: boolean
          example: false
      required:
        - id
        - title
        - done

    # ── DTO d'erreur ──────────────────────────────────────────────────────────
    ErrorDTO:
      type: object
      description: Représentation d'une erreur (validation ou serveur).
      properties:
        field:
          type: string
          description: Nom du champ en erreur (ou "server" pour une erreur inattendue)
          example: title
        message:
          type: string
          description: Description de l'erreur
          example: Le titre ne doit pas dépasser 50 caractères.
      required:
        - field
        - message